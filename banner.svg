<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 480" width="1500" height="480" role="img" aria-label="Isabella Piffer — Fullstack Developer">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1A1420"/>
      <stop offset="0.6" stop-color="#110E16"/>
      <stop offset="1" stop-color="#0D1117"/>
    </radialGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD6EA"/>
      <stop offset="1" stop-color="#FF8FC7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FF2E88" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="1500" height="480" fill="url(#bg)"/>
  <rect width="1500" height="480" fill="url(#dots)"/>

  <!-- trilhas de circuito -->
  <g fill="none" stroke="#FF2E88" stroke-width="1.5" opacity="0.35">
    <path d="M0 70 H180 L220 110 H330"/>
    <path d="M0 460 H120 L150 435 H300"/>
    <path d="M520 0 V40 L560 80 H700"/>
    <path d="M980 480 V440 L940 400 H820"/>
    <path d="M1500 60 H1360 L1320 100 H1240"/>
    <path d="M1500 430 H1380 L1340 390 H1250"/>
    <path d="M1060 0 V30 L1090 60 H1170"/>
  </g>
  <g fill="#FF2E88" opacity="0.7">
    <circle cx="330" cy="110" r="4"/><circle cx="300" cy="435" r="4"/>
    <circle cx="700" cy="80" r="4"/><circle cx="820" cy="400" r="4"/>
    <circle cx="1240" cy="100" r="4"/><circle cx="1250" cy="390" r="4"/>
    <circle cx="1170" cy="60" r="4"/>
  </g>

  <!-- janela de código (esquerda) -->
  <g transform="translate(40 130)">
    <rect width="300" height="200" rx="10" fill="#0D1117" stroke="#FF2E88" stroke-opacity="0.45"/>
    <rect width="300" height="28" rx="10" fill="#FF2E88" fill-opacity="0.12"/>
    <circle cx="16" cy="14" r="4.5" fill="#FF2E88"/><circle cx="32" cy="14" r="4.5" fill="#FF8FC7"/><circle cx="48" cy="14" r="4.5" fill="#FFD6EA"/>
    <text x="66" y="18.5" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#FF8FC7" opacity="0.8">isabella.js</text>
    <g font-family="Fira Code, Consolas, monospace" font-size="13">
      <text x="16" y="58"><tspan fill="#FF2E88">const</tspan><tspan fill="#FFD6EA"> isabella = {</tspan></text>
      <text x="32" y="82" fill="#FF8FC7">front: <tspan fill="#FFD6EA">"React"</tspan>,</text>
      <text x="32" y="104" fill="#FF8FC7">back:  <tspan fill="#FFD6EA">"Node · Python"</tspan>,</text>
      <text x="32" y="126" fill="#FF8FC7">dados: <tspan fill="#FFD6EA">"SQL"</tspan>,</text>
      <text x="32" y="148" fill="#FF8FC7">status: <tspan fill="#FFD6EA">"aprendendo"</tspan></text>
      <text x="16" y="172" fill="#FFD6EA">};</text>
    </g>
  </g>

  <!-- nome e cargo -->
  <g text-anchor="middle">
    <text x="750" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="300" letter-spacing="8" fill="url(#nome)" filter="url(#glowSoft)">ISABELLA PIFFER</text>
    <g stroke="#FF2E88" stroke-width="1.5" opacity="0.7">
      <path d="M470 268 H520"/><path d="M980 268 H1030"/>
    </g>
    <text x="750" y="276" font-family="Fira Code, Consolas, monospace" font-size="24" letter-spacing="9" fill="#FF2E88">FULLSTACK DEVELOPER</text>
    <text x="750" y="330" font-family="Fira Code, Consolas, monospace" font-size="22" fill="#FF8FC7">React · Node.js · Python · SQL</text>
  </g>

  <!-- ícones (direita) -->
  <g fill="none" stroke="#FF2E88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- </> -->
    <path d="M1205 150 L1180 175 L1205 200"/><path d="M1245 150 L1270 175 L1245 200"/><path d="M1232 145 L1218 205"/>
    <!-- banco de dados -->
    <ellipse cx="1370" cy="150" rx="38" ry="12"/>
    <path d="M1332 150 V205 A38 12 0 0 0 1408 205 V150"/>
    <path d="M1332 177 A38 12 0 0 0 1408 177"/>
  </g>
  <g fill="none" stroke="#FF8FC7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- servidor -->
    <rect x="1170" y="265" width="90" height="28" rx="6"/>
    <rect x="1170" y="303" width="90" height="28" rx="6"/>
    <path d="M1185 279 H1200"/><path d="M1185 317 H1200"/>
    <!-- { } -->
    <path d="M1358 262 C1340 262 1348 296 1334 297 C1348 298 1340 332 1358 332"/>
    <path d="M1392 262 C1410 262 1402 296 1416 297 C1402 298 1410 332 1392 332"/>
  </g>
  <g fill="#FF8FC7">
    <circle cx="1243" cy="279" r="3.5"/><circle cx="1243" cy="317" r="3.5"/>
  </g>
  <!-- linhas ligando front, back e dados -->
  <g fill="none" stroke="#FF2E88" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
    <path d="M1225 215 V255"/><path d="M1280 175 H1325"/><path d="M1370 222 V255"/><path d="M1265 297 H1325"/>
  </g>

  <!-- console (canto inferior esquerdo) -->
  <g font-family="Fira Code, Consolas, monospace" font-size="13">
    <text x="40" y="380" fill="#FF8FC7" opacity="0.75">&gt; status: <tspan fill="#FF2E88">aberta a oportunidades</tspan></text>
    <text x="40" y="402" fill="#FF8FC7" opacity="0.75">&gt; local: <tspan fill="#FF2E88">Brasil</tspan></text>
  </g>

  <!-- borda -->
  <rect x="1" y="1" width="1498" height="478" rx="14" fill="none" stroke="#FF2E88" stroke-opacity="0.25" stroke-width="2"/>
</svg>
